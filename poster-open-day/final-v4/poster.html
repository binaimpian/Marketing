<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Anton&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&family=Pacifico&family=Abril+Fatface&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#203A68;--blue:#2B55A0;--y:#F5B82E;--y2:#FFD86B}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:'Poppins';background:radial-gradient(ellipse at 30% 20%,#FFFFFF,#ECEEF2 70%)}
.abs{position:absolute}
.wm{left:-40px;top:120px;font-family:'Anton';font-size:420px;line-height:.9;color:transparent;-webkit-text-stroke:2px #20396812;transform:rotate(-6deg);white-space:nowrap}
svg.bands{position:absolute;inset:0}
.tab{left:0;top:0;width:470px;height:175px;background:#fff;border-radius:0 0 90px 0;box-shadow:0 10px 30px #20396818;display:flex;align-items:center;padding-left:60px}
.tab img{height:120px}
.hd{left:60px;top:205px;transform:rotate(-5deg);transform-origin:left}
.hd .l1{font-family:'Playfair Display';font-style:italic;font-weight:800;font-size:50px;color:var(--navy)}
.hd .pill{display:inline-block;margin-top:6px;background:var(--navy);color:#fff;font-family:'Playfair Display';font-style:italic;font-weight:900;font-size:54px;padding:2px 26px 6px;border-radius:16px}
.hd .pill span{color:var(--y)}
.jom{left:66px;top:368px;transform:rotate(-6deg);transform-origin:left;font-family:'Pacifico';font-size:62px;color:var(--y);-webkit-text-stroke:2.5px var(--navy);paint-order:stroke fill}
.open{left:52px;top:478px;transform:rotate(-6deg);transform-origin:left;font-family:'Abril Fatface';font-size:190px;line-height:1;color:#fff;-webkit-text-stroke:7px var(--navy);paint-order:stroke fill;letter-spacing:.01em;z-index:4}
.day{left:66px;top:655px;transform:rotate(-6deg);transform-origin:left;font-family:'Abril Fatface';font-size:190px;line-height:1;color:var(--navy);z-index:5;text-shadow:6px 6px 0 #ffffff88}
.grp{position:absolute;inset:0}
.grp img{position:absolute;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(0 14px 18px #0003)}
.g1{clip-path:polygon(0 0,100% 0,100% 787px,0 900px);z-index:3}
.g2{clip-path:polygon(0 0,100% 0,100% 990px,0 1103px);z-index:4}
.date{left:60px;top:1150px;display:flex;align-items:center;gap:22px;transform:rotate(-3deg)}
.date .ic{width:100px;height:100px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.date b{display:block;font-family:'Playfair Display';font-weight:900;font-size:60px;line-height:1;color:var(--navy)}
.date span{font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:28px;color:#3A4C70}
.cta{right:55px;top:1135px;transform:rotate(-3deg);border:4px dashed var(--navy);border-radius:28px;padding:18px 26px 20px;text-align:center;background:#fff}
.cta b{display:block;font-family:'Playfair Display';font-weight:900;font-size:34px;color:var(--navy);line-height:1.1}
.cta span{display:inline-block;margin-top:10px;background:var(--y);color:var(--navy);font-weight:800;font-size:26px;padding:6px 20px;border-radius:30px}
</style></head><body>
